name: Release (executável Windows)
on:
  push:
    tags: ["v*"]   # empurrar uma tag vN.N.N gera e publica a release pública
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag da versão (ex.: v0.2.0)"
        required: true
      publicar:
        description: "Publicar como release (false = só gera os artefatos)"
        type: boolean
        default: false
      rascunho:
        description: "Publicar como rascunho (false = release pública)"
        type: boolean
        default: true
permissions:
  contents: write
env:
  TAG: ${{ inputs.release_tag || github.ref_name }}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest pyinstaller
      - run: pytest -q
      - name: Empacotar
        shell: bash
        run: |
          pyinstaller --onefile --noconsole --name iped-ia-mcp --paths src --paths . \
            --collect-all fastmcp --collect-submodules iped_mcp \
            --hidden-import main --hidden-import requests --hidden-import dotenv \
            --add-data "web-api-launcher.py;." --add-data "prompts;prompts" \
            scripts/entry.py
      - name: Teste de fumaça
        shell: pwsh
        run: |
          # o .exe é de janela (sem console): Start-Process espera e redireciona a saída para arquivos
          foreach ($arg in "--version", "--selftest") {
            $p = Start-Process -FilePath ./dist/iped-ia-mcp.exe -ArgumentList $arg -Wait -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
            Get-Content out.txt, err.txt
            if ($p.ExitCode -ne 0) { throw "falhou: $arg (código $($p.ExitCode))" }
          }
      - name: Preparar arquivo
        shell: bash
        run: |
          mkdir -p out
          cp dist/iped-ia-mcp.exe out/iped-ia-mcp-windows-x64.exe
          cd out && sha256sum iped-ia-mcp-windows-x64.exe | tee iped-ia-mcp-windows-x64.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
  publish:
    needs: windows
    if: ${{ github.ref_type == 'tag' || inputs.publicar }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" != "tag" ] && [ "${{ inputs.rascunho }}" = "true" ]; then FLAGS="--draft"; else FLAGS="--latest"; fi
          gh release create "$TAG" dist/* --repo "${{ github.repository }}" \
            --title "$TAG" --target "${{ github.sha }}" --generate-notes $FLAGS
